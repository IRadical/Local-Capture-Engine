<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    :root {
        --color-primario: {{ colores.primario }};
        --color-secundario: {{ colores.secundario }};
        --color-acento: {{ colores.acento }};
        --color-fondo: {{ colores.fondo }};
        --color-texto: {{ colores.texto }};
        --color-tarjeta: {{ colores.tarjeta }};
    }
    body { background-color: var(--color-fondo); }
    .bg-tarjeta { background-color: var(--color-tarjeta); }
    .text-texto { color: var(--color-texto); }
    .bg-primario { background-color: var(--color-primario); }
    .card-seccion {
    background-color: var(--color-tarjeta);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s;
        }
        .card-seccion:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
</style>
</head>
<body class="bg-fondo">
    <div class="bg-tarjeta shadow-sm p-4 mb-6">
        <h1 class="text-2xl font-bold text-texto">{{ nombre_proyecto }}</h1>
        <p class="text-sm text-gray-500"> Catalogo fotografico por seccion</p>
    </div>
    <div class="px-4">
    <p class="text-xs font-semibold text-gray-400 mb-3 tracking-widest">
        SECCIONES
    </p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        {% for nombre, datos in secciones.items() %}
        <a href="/{{ nombre }}" 
           class="bg-tarjeta rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
            <p class="font-semibold text-texto mt-2">{{ nombre }}</p>
            <p class="text-xs text-gray-400 mt-1">0 dispositivos</p>
            <div class="mt-3 h-1 bg-gray-100 rounded-full">
                <div class="h-1 bg-primario rounded-full" style="width: 0%"></div>
            </div>
            <p class="text-xs text-gray-400 mt-1">0%</p>
        </a>
        {% endfor %}
    </div>
</div>
</body>
</html>
